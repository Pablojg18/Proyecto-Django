<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alumnos</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.2.2/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/3.2.3/css/buttons.dataTables.min.css">
    <style>
        body { font-family: sans-serif; margin: 2rem; background: #f6f7f9; color: #222; }
        h1 { border-bottom: 2px solid #0b5; padding-bottom: .3rem; }
        .volver { display: inline-block; margin-bottom: 1rem; color: #06a; }
        .contenedor { background: #fff; border-radius: 8px; padding: 1rem 1.2rem; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    </style>
</head>
<body>
    <h1>Alumnos</h1>
    <a class="volver" href="{% url 'index' %}">&larr; Volver al inicio</a>

    <div class="contenedor">
        <table id="tabla-alumnos" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>Matrícula</th>
                    <th>Nombre</th>
                    <th>Semestre</th>
                    <th>Estatus</th>
                    <th>Carrera</th>
                </tr>
            </thead>
            <tbody>
                {% for a in alumnos %}
                <tr>
                    <td>{{ a.matricula }}</td>
                    <td>{{ a.nombre }}</td>
                    <td>{{ a.semestre }}</td>
                    <td>{{ a.get_estatus_display }}</td>
                    <td>{{ a.carrera }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="5">Sin registros</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.2.2/js/dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.2.3/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.2.3/js/buttons.html5.min.js"></script>
    <script>
        new DataTable('#tabla-alumnos', {
            pageLength: 10,
            language: {
                url: 'https://cdn.datatables.net/plug-ins/2.2.2/i18n/es-MX.json'
            },
            dom: 'Bfrtip',
            buttons: [
                {
                    extend: 'excelHtml5',
                    text: 'Exportar a Excel',
                    title: 'Alumnos',
                    exportOptions: { columns: ':visible' }
                },
                'csv',
                'print'
            ]
        });
    </script>
</body>
</html>
